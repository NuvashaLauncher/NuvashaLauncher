name: Build and test

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: ARM64
            runner: ubuntu-26.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
             gcc g++ make pkg-config gettext \
             libasan8 libubsan1 \
             libglib2.0-dev libgtk-4-dev libadwaita-1-dev libepoxy-dev \
             libjson-glib-dev libsoup-3.0-dev libarchive-dev

      - name: Build
        run: make fast CFLAGS="-std=c17 -Wall -Wextra -Wpedantic -Werror -MMD -MP"

      - name: Run tests
        run: make test

      - name: Run sanitizer tests
        run: make test-debug

      - name: Run leak sanitizer tests
        run: make test-lsan

      - name: Run static analysis
        run: make static-analysis
