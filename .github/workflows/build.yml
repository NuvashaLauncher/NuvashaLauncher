name: Build and test

on:
  push:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Static analysis (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: ARM64
            runner: ubuntu-26.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          apt-get update -o Acquire::Languages=none
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
             gcc make pkg-config \
             libglib2.0-dev libgtk-4-dev libadwaita-1-dev libepoxy-dev \
             libjson-glib-dev libsoup-3.0-dev libarchive-dev libsecret-1-dev

      - name: Run static analysis
        run: make -j$(nproc) static-analysis

      - name: Check POTFILES.in
        run: make check-potfiles

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: ARM64
            runner: ubuntu-26.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          apt-get update -o Acquire::Languages=none
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
             gcc make pkg-config gettext \
             dbus xvfb adwaita-icon-theme \
             libasan8 libubsan1 \
             libglib2.0-dev libgtk-4-dev libadwaita-1-dev libepoxy-dev \
             libjson-glib-dev libsoup-3.0-dev libarchive-dev libsecret-1-dev

      - name: Build and run tests
        run: |
          make -j$(nproc) all CFLAGS="-std=c17 -Wall -Wextra -Wpedantic -Werror -MMD -MP"
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" \
            env GDK_BACKEND=x11 GSK_RENDERER=cairo GTK_A11Y=none \
            make -j$(nproc) test CFLAGS="-std=c17 -Wall -Wextra -Wpedantic -Werror -MMD -MP"

      - name: Run sanitizer tests
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" \
            env GDK_BACKEND=x11 GSK_RENDERER=cairo GTK_A11Y=none \
            make -j$(nproc) test-debug CFLAGS="-std=c17 -Wall -Wextra -Wpedantic -Werror -MMD -MP"
