name: Build and test

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: ARM64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel pkgconf gettext \
            glib2 gtk4 libadwaita libepoxy json-glib libsoup3 libarchive

      - name: Build
        run: make fast

      - name: Run tests
        run: make test

      - name: Run static analysis
        run: make static-analysis
