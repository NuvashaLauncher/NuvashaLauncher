name: Flatpak

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          dnf install -y \
            ca-certificates \
            flatpak \
            flatpak-builder \
            git \
            xorg-x11-server-Xvfb
          flatpak remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: NuvashaLauncher.flatpak
          manifest-path: packaging/flatpak/com.github.nuvashalauncher.Nuvasha.yml
          cache: true
