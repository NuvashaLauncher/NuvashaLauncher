name: Flatpak

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'tests/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    container:
      image: ubuntu:26.04
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Flatpak tooling
        run: |
          apt-get update -o Acquire::Languages=none
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            elfutils \
            flatpak \
            flatpak-builder \
            git \
            make
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ runner.arch }}-${{ hashFiles('packaging/flatpak/**') }}
          restore-keys: |
            flatpak-builder-${{ runner.arch }}-

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub --repo=flatpak-repo \
            flatpak-build packaging/flatpak/com.github.NuvashaLauncher.NuvashaLauncher.yml
          flatpak build-bundle flatpak-repo nuvashalauncher.flatpak \
            com.github.NuvashaLauncher.NuvashaLauncher

      - name: Install Flatpak bundle
        run: |
          flatpak install --user --noninteractive nuvashalauncher.flatpak

      - name: Run Flatpak smoke test
        run: make test-flatpak-runtime

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuvashalauncher.flatpak
          path: nuvashalauncher.flatpak
          if-no-files-found: error
