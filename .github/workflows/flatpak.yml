name: Flatpak

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-26.04
    container:
      image: ubuntu:26.04
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Flatpak tooling
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            flatpak \
            flatpak-builder \
            git \
            make
          flatpak remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: nuvashalauncher.flatpak
          manifest-path: packaging/flatpak/com.github.nuvashalauncher.nuvashalauncher.yml
          cache: true

      - name: Install Flatpak bundle
        run: flatpak install --user --noninteractive nuvashalauncher.flatpak

      - name: Run Flatpak smoke test
        run: make test-flatpak-runtime
