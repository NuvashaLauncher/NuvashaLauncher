image: archlinux:base-devel

stages:
  - test
  - analysis

variables:
  DEBIAN_FRONTEND: noninteractive

.setup:
  before_script:
    - pacman -Syu --noconfirm
    - pacman -S --noconfirm
        gettext
        pkgconf
        libarchive
        libadwaita
        gtk4
        json-glib
        libsoup3

test:
  extends: .setup
  stage: test
  script:
    - make test

sanitizers:
  extends: .setup
  stage: test
  script:
    - make test-debug

static-analysis:
  extends: .setup
  stage: analysis
  script:
    - |
      set -eu
      for source in src/*.c; do
        gcc -std=c17 -Wall -Wextra -Wpedantic -fanalyzer -fsyntax-only \
          $(pkg-config --cflags gtk4 libadwaita-1 json-glib-1.0 \
            libsoup-3.0 libarchive gio-unix-2.0) \
          -Isrc "$source"
      done
