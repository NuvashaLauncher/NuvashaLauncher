image: archlinux:base-devel

stages:
  - test
  - analysis

variables:
  DEBIAN_FRONTEND: noninteractive

.setup:
  before_script:
    - pacman -Syu --noconfirm
    - pacman -S --noconfirm
        gettext
        pkgconf
        libarchive
        libadwaita
        gtk4
        json-glib
        libsoup3
        clang
        cppcheck
        valgrind

test:
  extends: .setup
  stage: test
  script:
    - make test

sanitizers:
  extends: .setup
  stage: test
  script:
    - make test-debug

# make static-analysis already runs the GCC analyzer over every source,
# then clang-tidy and cppcheck. The loop that used to sit in front of it
# ran that same analyzer pass a second time, doubling the slowest step of
# the job for no extra coverage.
static-analysis:
  extends: .setup
  stage: analysis
  script:
    - make static-analysis

leaks:
  extends: .setup
  stage: test
  script:
    - make test-lsan

valgrind:
  extends: .setup
  stage: analysis
  script:
    - make test-valgrind
