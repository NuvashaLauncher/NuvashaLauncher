image: ubuntu:24.04

stages:
  - test
  - analysis

variables:
  DEBIAN_FRONTEND: noninteractive

.setup:
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
        build-essential
        gettext
        pkg-config
        libarchive-dev
        libadwaita-1-dev
        libgtk-4-dev
        libjson-glib-dev
        libsoup-3.0-dev

test:
  extends: .setup
  stage: test
  script:
    - make test

sanitizers:
  extends: .setup
  stage: test
  script:
    - make test-debug

static-analysis:
  extends: .setup
  stage: analysis
  script:
    - |
      set -eu
      for source in src/*.c; do
        gcc -std=c17 -Wall -Wextra -Wpedantic -fanalyzer -fsyntax-only \
          $(pkg-config --cflags gtk4 libadwaita-1 json-glib-1.0 \
            libsoup-3.0 libarchive gio-unix-2.0) \
          -Isrc "$source"
      done
