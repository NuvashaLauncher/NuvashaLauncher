app-id: com.github.nuvashalauncher.nuvasha
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: NuvashaLauncher
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --talk-name=org.freedesktop.secrets
modules:
  - name: nuvasha
    buildsystem: simple
    build-commands:
      - make FLATPAK=1 PREFIX=/app
      - make FLATPAK=1 PREFIX=/app install
    sources:
      - type: git
        url: https://github.com/NuvashaLauncher/NuvashaLauncher.git
        branch: flatpak
